name: Android APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore (optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          tasks=":app:assembleRelease"
          if [ -n "${RELEASE_KEYSTORE_PATH:-}" ]; then tasks="$tasks :app:bundleRelease"; fi
          ./gradlew --no-daemon $tasks
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Kimba.apk
          if [ -d app/build/outputs/bundle/release ]; then cp app/build/outputs/bundle/release/*.aab dist/Kimba.aab; fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Kimba-apk
          path: dist/*
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Kimba-apk
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -memory 4096 -cores 4 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh dist/Kimba.apk screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screens/

  publish:
    needs: [build, smoke-test]
    # Also publish when the smoke test fails, so its screenshots and logs can be inspected.
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kimba-apk
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshots
          path: screens
      - name: Update "latest build" pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p screens && cd screens && (zip -q ../dist/screenshots.zip *.png *.txt *.gz || true); cd ..
          gh release delete kimba-apk-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create kimba-apk-latest dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Kimba! – naujausias build #${{ github.run_number }} (Test: ${{ needs.smoke-test.result }})" \
            --notes "Automatiškai sukurta iš ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Atsisiųsk Kimba.apk telefone ir įdiek."
