name: Android APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Records any new texts with the Ona voice and commits them, so the APK always has every sound.
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Course checks and list of texts
        run: ./gradlew --no-daemon -PcoreOnly :core:test :core:listAudio
      - run: pip install edge-tts
      - name: Record missing sounds
        run: python .github/scripts/garsai.py
      - name: Commit sounds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garsai app/src/main/assets/audio
          if git diff --cached --quiet; then echo "No new sounds"; exit 0; fi
          git commit -m "Garsai: įrašyti nauji tekstai Onos balsu"
          git push

  build:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      PRIVACY_URL: ${{ secrets.PRIVACY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore (optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "Sounds bundled: $(ls app/src/main/assets/audio | wc -l)"
          tasks=":app:assembleRelease"
          if [ -n "${RELEASE_KEYSTORE_PATH:-}" ]; then tasks="$tasks :app:bundleRelease"; fi
          ./gradlew --no-daemon $tasks
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SkaitauPats.apk
          if [ -d app/build/outputs/bundle/release ]; then cp app/build/outputs/bundle/release/*.aab dist/SkaitauPats.aab; fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SkaitauPats-apk
          path: dist/*
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SkaitauPats-apk
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -memory 4096 -cores 4 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh dist/SkaitauPats.apk screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screens/

  publish:
    needs: [build, smoke-test]
    # Also publish when the smoke test fails, so its screenshots and logs can be inspected.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SkaitauPats-apk
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screenshots
          path: screens
      - name: Update "latest build" pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p screens && cd screens && (zip -q ../dist/screenshots.zip *.png *.txt *.gz || true); cd ..
          gh release delete apk-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create apk-latest dist/* --repo "$GITHUB_REPOSITORY" --target "${GITHUB_REF_NAME}" --prerelease \
            --title "Skaitau Pats – naujausia versija #${{ github.run_number }} (testas: ${{ needs.smoke-test.result }})" \
            --notes "Automatiškai surinkta iš ${GITHUB_REF_NAME}. Atsisiųskite SkaitauPats.apk telefone ir įdiekite."
