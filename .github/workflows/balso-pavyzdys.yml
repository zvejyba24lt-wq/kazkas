name: Balso pavyzdys
on:
  push:
    branches: [claude/project-thread-hw8ayu]
    paths: [balso-pavyzdys/tekstai.txt, .github/workflows/balso-pavyzdys.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - name: Generate
        run: |
          cd balso-pavyzdys
          rm -rf ona leonas && mkdir ona leonas
          while IFS='|' read -r name text; do
            [ -z "$name" ] && continue
            edge-tts --voice lt-LT-OnaNeural --rate=-20% --text "$text" --write-media "ona/$name.mp3"
            edge-tts --voice lt-LT-LeonasNeural --rate=-20% --text "$text" --write-media "leonas/$name.mp3"
          done < tekstai.txt
          ls -l ona leonas
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add balso-pavyzdys
          git commit -m "Balso pavyzdys: sugeneruoti garsai" || exit 0
          git push
